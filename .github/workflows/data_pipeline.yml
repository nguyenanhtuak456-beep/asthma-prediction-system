name: Auto Fetch and Update Air Quality Data

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ 1 lần
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công trên web bất cứ lúc nào

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền cho phép GitHub Actions ghi và push code lên repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run fetch and process script
        run: |
          python fetch_and_process.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/live_processed.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live_processed.csv automatically" && git push)
