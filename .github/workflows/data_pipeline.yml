name: Auto Fetch and Fine-tune Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ 1 lần
  workflow_dispatch:

jobs:
  update-data-and-retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests catboost huggingface_hub

      - name: Run fetch and process
        run: |
          python src/fetch_and_process.py

      - name: Run retrain script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python models/retrain.py

      - name: Commit and push data changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/live_processed.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live_processed.csv & retrain model" && git push)
